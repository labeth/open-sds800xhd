schemaVersion: 2
architecture:
  functionalGroups:
  - id: FG-HD-APP
    name: Scope application
    description: The one device main and its wiring of the core over this board.
    prose: The one device main and its wiring of the core over this board.
  - id: FG-HD-BOARD
    name: Board support
    description: The hardware code of the SDS800X HD and its implementation of the core's board interface, the SCPI
      dialect and the measurements adapter.
    prose: The hardware code of the SDS800X HD and its implementation of the core's board interface, the SCPI dialect
      and the measurements adapter.
  - id: FG-HD-OPERATIONS
    name: Operations
    description: Launch hook, install and uninstall sticks, A/B slots, the supervisor's board side and the read-only
      census.
    prose: Launch hook, install and uninstall sticks, A/B slots, the supervisor's board side and the read-only census.
  - id: FG-HD-PL
    name: Open PL design
    description: The open programmable-logic design that replaces the vendor bitstream (spec 20), its register ABI,
      its simulation, lint and synthesis lanes and its Vivado build.
    prose: The open programmable-logic design that replaces the vendor bitstream (spec 20), its register ABI, its
      simulation, lint and synthesis lanes and its Vivado build.
  - id: FG-HD-VERIFICATION
    name: Verification
    description: The in-guest board tests, the trigger goldens and the tier-1 simulator parity harness.
    prose: The in-guest board tests, the trigger goldens and the tier-1 simulator parity harness.
  functionalUnits:
  - id: FU-HD-APP
    name: Scope application
    group: FG-HD-APP
    prose: 'The one device main: platform takeover, start-up, the owner loop and the host transports. (app/cmd/app,
      app/internal/app)'
    tags:
    - package:app/cmd/app, app/internal/app
  - id: FU-HD-PLATFORM
    name: Platform
    group: FG-HD-BOARD
    prose: 'The scope''s place in the vendor system: paths, hardware identity, takeover and the disable switch.
      (app/internal/platform)'
    tags:
    - package:app/internal/platform
  - id: FU-HD-MMIO
    name: Register access
    group: FG-HD-BOARD
    prose: 'Register access to the programmable logic and the PS: one lock per plane, shadows and the write rule.
      (app/internal/mmio)'
    tags:
    - package:app/internal/mmio
  - id: FU-HD-BOARD
    name: Register blocks
    group: FG-HD-BOARD
    prose: The register blocks of the programmable logic (spec 02 and its appendix tables). (app/internal/board)
    tags:
    - package:app/internal/board
  - id: FU-HD-SPI
    name: Front-end SPI bus
    group: FG-HD-BOARD
    prose: 'The front-end SPI bus: clock chip, the two ADCs, VGAs and offset DACs. (app/internal/spi)'
    tags:
    - package:app/internal/spi
  - id: FU-HD-FRONTEND
    name: Analog front end
    group: FG-HD-BOARD
    prose: 'The analog path: relay shift register, gain, offset and the V/div tables (spec 06, spec 10). (app/internal/frontend)'
    tags:
    - package:app/internal/frontend
  - id: FU-HD-TIMEBASE
    name: Timebase arithmetic
    group: FG-HD-BOARD
    prose: Sample rates, decimation, memory depths and the timebase table (spec 04). (app/internal/timebase)
    tags:
    - package:app/internal/timebase
  - id: FU-HD-TRIGGER
    name: Trigger engine
    group: FG-HD-BOARD
    prose: The PL trigger engine (spec 05). (app/internal/trigger)
    tags:
    - package:app/internal/trigger
  - id: FU-HD-ACQ
    name: Acquisition owner
    group: FG-HD-BOARD
    prose: The start-up order, the arm/stop frame loop and the record readout through the AXI DMA (spec 03). (app/internal/acq)
    tags:
    - package:app/internal/acq
  - id: FU-HD-MAPENGINE
    name: Map engine
    group: FG-HD-BOARD
    prose: The PL map engine that draws the waveform layer (spec 07). (app/internal/mapengine)
    tags:
    - package:app/internal/mapengine
  - id: FU-HD-DISPLAY
    name: UI layer
    group: FG-HD-BOARD
    prose: The UI framebuffer layer and screen capture. (app/internal/display)
    tags:
    - package:app/internal/display
  - id: FU-HD-PANEL
    name: Front panel
    group: FG-HD-BOARD
    prose: The key matrix, encoders, key LEDs, touch and beeper (spec 08). (app/internal/panel)
    tags:
    - package:app/internal/panel
  - id: FU-HD-COUNTER
    name: Frequency counter
    group: FG-HD-BOARD
    prose: The PL frequency counter and totalizer (spec 15). (app/internal/counter)
    tags:
    - package:app/internal/counter
  - id: FU-HD-SCOPEBOARD
    name: Board interface implementation
    group: FG-HD-BOARD
    prose: The core's board interface (package hal) implemented over the hardware packages. (app/internal/scopeboard)
    tags:
    - package:app/internal/scopeboard
  - id: FU-HD-MEASUREMENT
    name: Measurements adapter
    group: FG-HD-BOARD
    prose: Runs the core's automatic measurements on this scope's read-out frames. (app/internal/measurement)
    tags:
    - package:app/internal/measurement
  - id: FU-HD-SCPI
    name: SCPI dialect
    group: FG-HD-BOARD
    prose: This scope's SCPI dialect over the core's engine, from spec 11 and its appendix tables. (app/internal/scpi)
    tags:
    - package:app/internal/scpi
  - id: FU-HD-PLIMAGE
    name: PL image gate
    group: FG-HD-BOARD
    prose: 'The gate before an open PL image is loaded through fpga_manager: its build manifest must declare every
      board fact of spec 20 §14 verified and match the image. (app/internal/plimage)'
    tags:
    - package:app/internal/plimage
  - id: FU-HD-OTA-BOOT
    name: Launch hook
    group: FG-HD-OPERATIONS
    prose: The launch hook on p12 that starts the app. (ota/boot)
    tags:
    - package:ota/boot
  - id: FU-HD-OTA-INSTALL
    name: Install sticks
    group: FG-HD-OPERATIONS
    prose: What the install and uninstall sticks do to p12, and their initramfs /init. (ota/internal/install, ota/cmd/oinit)
    tags:
    - package:ota/internal/install, ota/cmd/oinit
  - id: FU-HD-OTA-SLOTS
    name: A/B slots
    group: FG-HD-OPERATIONS
    prose: The A/B slot layout on p12. (ota/internal/slots)
    tags:
    - package:ota/internal/slots
  - id: FU-HD-OTA-BOARD
    name: Supervisor board side
    group: FG-HD-OPERATIONS
    prose: 'The board side of the core''s supervisor, its manual controller and the owner''s boot target (next boot:
      open or vendor firmware, the core''s boottarget). (ota/internal/board, ota/cmd/otactl)'
    tags:
    - package:ota/internal/board, ota/cmd/otactl
  - id: FU-HD-CENSUS
    name: Census
    group: FG-HD-OPERATIONS
    prose: 'The read-only census of the unit: identity and backups, nothing written. (ota/census, ota/cmd/census)'
    tags:
    - package:ota/census, ota/cmd/census
  - id: FU-HD-OTA-GUARD
    name: Write guard
    group: FG-HD-OPERATIONS
    prose: 'The one write guard every file, device-node and /dev/mem write of the unit goes through: p12''s root only,
      never the boot, kernel, vendor or factory partitions, a U-Boot environment, raw eMMC, eFuses or BBRAM: this unit''s
      policy for the core''s fsguard, imported by the app and the ota module. (app/hdguard)'
    tags:
    - package:app/hdguard
  - id: FU-HD-BOARDTEST
    name: Board tests
    group: FG-HD-VERIFICATION
    prose: The in-guest board tests through the HAL and the trigger register goldens. (app/internal/boardtest, app/internal/trigcases)
    tags:
    - package:app/internal/boardtest, app/internal/trigcases
  - id: FU-HD-SIM
    name: Simulator harness
    group: FG-HD-VERIFICATION
    prose: Runs the app in the tier-1 simulator and the parity harness over every HAL area. (sim)
    tags:
    - package:sim
  - id: FU-HD-PL
    name: Open PL RTL
    group: FG-HD-PL
    prose: 'The open PL blocks: register ABI and register files with the compat planes, trigger engine, protocol
      triggers, stream framer, stacking accumulator and the primitive wrappers with their behavioural models (spec
      20). (fpga/regs, fpga/rtl, fpga/prim)'
    tags:
    - package:fpga/rtl, fpga/prim, fpga/regs
  - id: FU-HD-PL-BUILD
    name: Open PL build
    group: FG-HD-PL
    prose: 'The register generator, the simulation, Verilator lint, yosys neutrality and Vivado out-of-context
      synthesis lanes, and the Vivado project, block design and constraints. (fpga/tools, fpga/vivado, fpga/*.sh)'
    tags:
    - package:fpga/tools, fpga/vivado
  - id: FU-HD-PL-TESTS
    name: Open PL testbenches
    group: FG-HD-PL
    prose: The self-checking iverilog testbenches of the open PL blocks. (fpga/*/sim)
    tags:
    - package:fpga/rtl/*/sim, fpga/prim/sim
  contract:
    provides:
    - id: CAP-HD-PLATFORM
      kind: capability
      note: 'Run the open firmware on the unit beside the vendor firmware: take the hardware over from the vendor
        application and return to it when uninstalled or disabled at power-on.'
    - id: CAP-HD-ACQUISITION
      kind: capability
      note: Bring the front end, converters and timebase up in the start-up order of the specifications, acquire
        with the trigger and read records out in volts for the core.
    - id: CAP-HD-DISPLAY-PANEL
      kind: capability
      note: Show the core's user interface over the PL-drawn waveform layer and operate the instrument from its
        front panel.
    - id: CAP-HD-REMOTE
      kind: capability
      note: Program the instrument remotely in this scope's SCPI dialect.
    - id: CAP-HD-SETTINGS
      kind: capability
      note: Keep the instrument state across power cycles and know the unit's model and options.
    - id: CAP-HD-SUPERVISION
      kind: capability
      note: Run and update the app under the core's supervisor with A/B slots and rollback.
    - id: CAP-HD-CENSUS
      kind: capability
      note: Take a read-only census and backups of a unit before any install.
    - id: CAP-HD-SIMULATION
      kind: capability
      note: Verify the firmware in the tier-1 simulator against a private reference run.
  actors:
  - id: ACT-OPERATOR
    name: Instrument operator
  - id: ACT-HOST
    name: Remote instrument client
  - id: ACT-MAINTAINER
    name: Firmware maintainer
  composition:
    subsystems:
    - id: SUB-CORE
      name: open-dso-core
      dependency: core
      publication: public
